name: Auto Ecole Build

on:
  push:
    branches: ["dev"]
  pull_request:
    branches: ["dev"]

jobs:
  build:
    runs-on: ubuntu-latest

    # IMPORTANT: this enables staging environment vars + secrets
    environment: staging

    env:
      AUTO_ECOLE_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      AUTO_ECOLE_USERNAME: ${{ github.actor }}
      DOCKERHUB_USERNAME: ${{ vars.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ vars.DOCKERHUB_TOKEN }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Run tests
        run: ./gradlew test

      - name: Build project
        run: ./gradlew clean build -x test

      # Docker login (now works because staging env is loaded)
      - name: Log in to Docker Hub
        run: echo "$DOCKERHUB_TOKEN" | docker login -u "$DOCKERHUB_USERNAME" --password-stdin

      # Jib build & push
      - name: Build & push Docker image with Jib
        run: ./gradlew jib --info
        env:
          DOCKERHUB_USERNAME: ${{ vars.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ vars.DOCKERHUB_TOKEN }}

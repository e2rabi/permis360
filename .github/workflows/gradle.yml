name: Dev Build
env:
    AUTO_ECOLE_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    AUTO_ECOLE_USERNAME: ${{ github.actor }}
on:
  push:
    branches: [ "dev"]
  pull_request:
    branches: [ "dev"]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Build with Gradle
        run: ./gradlew clean build

      - name: Run tests
        run: ./gradlew test

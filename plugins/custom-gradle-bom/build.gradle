plugins {
    id 'java-platform'
}

javaPlatform {
    allowDependencies()
}
dependencies {
    constraints {
        api 'org.springframework.boot:spring-boot-starter-webflux:3.5.7'
        api 'org.springframework.boot:spring-boot-starter-test:3.5.7'
        api 'org.springframework.boot:spring-boot-starter-data-jpa:3.5.7'
        api 'org.springframework.boot:spring-boot-devtools:3.5.7'
        api 'org.mapstruct:mapstruct:1.6.3'
        api 'org.mapstruct:mapstruct-processor:1.6.3'
        api 'org.projectlombok:lombok:1.18.42'
        api 'org.projectlombok:lombok:1.18.42'
    }
}

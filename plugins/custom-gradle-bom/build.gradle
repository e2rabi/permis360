plugins {
    id 'java-platform'
}

javaPlatform {
    allowDependencies()
}
dependencies {
    constraints {
        api 'org.springframework.boot:spring-boot-starter-webflux:3.5.7'
        api 'org.springframework.boot:spring-boot-starter-web:3.5.7'
        api 'org.springframework.boot:spring-boot-starter-test:3.5.7'
        api 'org.springframework.boot:spring-boot-starter-data-jpa:3.5.7'
        api 'org.springframework.boot:spring-boot-starter-actuator:3.5.7'
        api 'org.springframework.boot:spring-boot-starter-validation:3.5.7'
        api("org.springframework.boot:spring-boot-starter-oauth2-client:3.5.7")
        api 'org.springframework.boot:spring-boot-starter-oauth2-client:3.5.7'
        api 'org.springframework.boot:spring-boot-starter-oauth2-resource-server:3.5.7'
        api 'org.springframework.boot:spring-boot-devtools:3.5.7'
        api 'io.micrometer:micrometer-registry-prometheus:1.16.0'


        api 'org.mapstruct:mapstruct-processor:1.5.5.Final'
        api 'org.projectlombok:lombok:1.18.32'
        api 'org.mapstruct:mapstruct:1.5.5.Final'
        api 'org.projectlombok:lombok-mapstruct-binding:0.2.0'
        api 'com.h2database:h2:2.2.220'
        api 'org.flywaydb:flyway-core:9.22.0'
        api 'jakarta.validation:jakarta.validation-api:3.0.2'
        api 'com.fasterxml.jackson.core:jackson-databind:2.15.2'
        api 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.1.0'
        api 'org.springdoc:springdoc-openapi-ui:1.6.15'





    }
}

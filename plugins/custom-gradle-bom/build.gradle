plugins {
    id 'java-platform'
}

javaPlatform {
    allowDependencies()
}
dependencies {
    constraints {
        api 'org.springframework.boot:spring-boot-starter-webflux:3.5.7'
        api 'org.springframework.boot:spring-boot-starter-test:3.5.7'
        api 'org.springframework.boot:spring-boot-starter-data-jpa:3.5.7'
        api 'org.springframework.boot:spring-boot-devtools:3.5.7'

        api 'org.mapstruct:mapstruct-processor:1.5.5.Final'
        api 'org.projectlombok:lombok:1.18.32'
        api 'org.mapstruct:mapstruct:1.5.5.Final'
        api 'org.projectlombok:lombok-mapstruct-binding:0.2.0'

    }
}

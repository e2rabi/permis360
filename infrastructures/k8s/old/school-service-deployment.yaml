apiVersion: apps/v1
kind: Deployment
metadata:
  name: school-service-deployment
  namespace: dev
  annotations:
    argo-cd.argoproj.io/sync-wave: "3"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: school-service
  template:
    metadata:
      labels:
        type: backend
        app: school-service
    spec:
      automountServiceAccountToken: false
      containers:
        - image: e2rabi11/school-service:0.1.4-SNAPSHOT
          name: school-service
          ports:
            - containerPort: 8080
          imagePullPolicy: Always
          securityContext:
              runAsUser: 1001
              runAsNonRoot: true
              readOnlyRootFilesystem: true
              allowPrivilegeEscalation: false
              seccompProfile:
                type: RuntimeDefault
          resources:
             requests:
                memory: "500Mi"
                cpu: "500m"
             limits:
                memory: "500Mi"
                cpu: "1000m"
          volumeMounts:
            - name: tmp-volume
              mountPath: /tmp
              readOnly: false
      volumes:
        - name: tmp-volume
          emptyDir: { }
      imagePullSecrets:
        - name: dockerhub-secret
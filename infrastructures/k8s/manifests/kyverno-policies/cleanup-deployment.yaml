apiVersion: kyverno.io/v2
kind: ClusterCleanupPolicy
metadata:
  name: cleandeploy
spec:
  match:
    any:
      - resources:
          kinds:
            - Deployment
          selector:
            matchLabels:
              env: 'staging'
  conditions:
    any:
      - key: '{{ target.spec.replicas }}'
        operator: GreaterThan
        value: 1
  schedule: '*/5 * * * *'

apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: cluster-policy-require-labels
spec:
  background: false
  rules:
    - name: check-for-labels
      match:
        any:
          - resources:
              kinds:
                - Pod
              operations:
                - CREATE
      validate:
        failureAction: Enforce
        message: "The label 'env' is required and must not be empty."
        pattern:
          metadata:
            labels:
              env: "?*
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: cluster-policy-require-labels
spec:
  background: false
  rules:
    - name: check-for-labels
      match:
        any:
          - resources:
              kinds:
                - 'POD'
              operations:
                - CREATE
      validate:
        failureAction: Audit
        message: 'The label `env` is required.'
        pattern:
          metadata:
            labels:
              env : '?*'
apiVersion: apps/v1
kind: Deployment
metadata:
  name: jaeger-service
  namespace: staging
  labels:
    app: jaeger
spec:
  replicas: 1
  selector:
    matchLabels:
      app: jaeger
  template:
    metadata:
      labels:
        app: jaeger
    spec:
      automountServiceAccountToken: false
      containers:
        - name: jaeger
          image: jaegertracing/all-in-one:1.67.0
          ports:
            - containerPort: 16686
              name: ui
            - containerPort: 14250
              name: grpc
apiVersion: apps/v1
kind: Deployment
metadata:
  name: keycloak
  namespace: staging
  labels:
    app: keycloak
spec:
  replicas: 1
  selector:
    matchLabels:
      app: keycloak
  template:
    metadata:
      labels:
        app: keycloak
    spec:
      initContainers:
        - name: fix-permissions
          image: busybox
          command: [ "sh", "-c", "chown -R 1000:1000 /opt/keycloak/data" ]
          volumeMounts:
            - name: keycloak-data
              mountPath: /opt/keycloak/data
      containers:
        - name: keycloak
          image: keycloak/keycloak:25.0.1
          args: ["start-dev", "--metrics-enabled=true"]
          env:
            - name: KEYCLOAK_ADMIN
              valueFrom:
                secretKeyRef:
                  name: keycloak-credentials
                  key: admin-user
            - name: KEYCLOAK_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: keycloak-credentials
                  key: admin-password
            - name: KC_HTTP_ENABLED
              value: "true"
            - name: KC_HEALTH_ENABLED
              value: "true"
            - name: KC_METRICS_ENABLED
              value: "true"

            # --- INGRESS ROUTING FIXES ---

            # 1. Trust the headers passed by the NGINX Ingress
            - name: KC_PROXY_HEADERS
              value: "xforwarded"

            # 2. Match the /auth path defined in your Ingress rules
            - name: KC_HTTP_RELATIVE_PATH
              value: "/auth"

            # 3. Disable strict hostname checks so it accepts the raw IP from the Ingress
            - name: KC_HOSTNAME_STRICT
              value: "false"

          ports:
            - containerPort: 8080
              name: http
          volumeMounts:
            - name: keycloak-data
              mountPath: /opt/keycloak/data
      volumes:
        - name: keycloak-data
          persistentVolumeClaim:
            claimName: keycloak-pvc
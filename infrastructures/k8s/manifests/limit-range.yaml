apiVersion: v1
kind: LimitRange
metadata:
  name: cpu-resource-constraint
  namespace: dev
  annotations:
    argo-cd.argoproj.io/sync-wave: "1"
spec:
  limits:
    - default:
        cpu: 500m
        memory: 250Mi
      defaultRequest:
        cpu: 500m
        memory: 250Mi
      max:
        cpu: 1000m
        memory: 500Mi
      min:
        cpu: 500m
        memory: 200Mi
      type: Container

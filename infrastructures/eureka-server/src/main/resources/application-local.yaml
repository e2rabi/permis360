spring:
   application:
    name : eureka-server

server:
  port: 8761

app:
  eureka:
    username: admin
    password: "{noop}admin"
    basic-auth:
      enabled: false

eureka:
  instance:
    hostname: localhost
  client:
    registerWithEureka: false
    fetchRegistry: false
    serviceUrl:
        defaultZone: http://${eureka.instance.hostname}:${server.port}/eureka/
  server:
       waitTimeInMsWhenSyncEmpty: 0
       responseCacheUpdateIntervalMs:  5000

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus
  endpoint:
    health:
      show-details: always
  metrics:
    tags:
      application: eureka-service
      environment: local
global:
  scrape_interval: 15s

scrape_configs:
  - job_name: "document-service"
    metrics_path: "/actuator/prometheus"
    static_configs:
      - targets: ["document-service:8080"]

  - job_name: "school-service"
    metrics_path: "/actuator/prometheus"
    static_configs:
      - targets: ["school-service:8080"]

  - job_name: "appointment-service"
    metrics_path: "/actuator/prometheus"
    static_configs:
      - targets: ["appointment-service:8080"]

  - job_name: "eureka-service"
    metrics_path: "/actuator/prometheus"
    static_configs:
      - targets: ["eureka-service:8080"]

  - job_name: "api-gateway-service"
    metrics_path: "/actuator/prometheus"
    static_configs:
      - targets: ["api-gateway-service:8443"]

  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'keycloak'
    metrics_path: /metrics
    static_configs:
      - targets: ['keycloak-service:9000']

  - job_name: 'minio'
    metrics_path: /minio/v2/metrics/cluster
    static_configs:
      - targets: ['minio-service:9000']

  - job_name: 'redis'
    static_configs:
      - targets: ['redis-exporter:9121']
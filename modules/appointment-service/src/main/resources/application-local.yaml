spring:
  docker:
    compose:
      enabled: true
      lifecycle-management: start_and_stop
      file: ./docker-compose-dev.yaml
  application:
    name: appointment-service
  cloud:
    openfeign:
      oauth2:
        enabled: true
        clientRegistrationId: keycloak
  security:
    oauth2:
      resourceserver: # Resource Server Configuration used to validate incoming JWT tokens
        jwt:
          issuer-uri: http://localhost:8080/realms/api-core
      client: # OAuth2 Client Configuration used for outgoing requests
        registration:
          keycloak:
            client-id: siyaka-client
            scope: openid,profile,email
            client-secret: isCfVzXZDfsNiyo5HiKpfkFlg7bV3cGS
            authorization-grant-type: client_credentials
        provider:
          keycloak:
            issuer-uri: http://localhost:8080/realms/api-core
  # H2 Database Configuration
  datasource:
    url: jdbc:postgresql://localhost:5432/autoecole_db?currentSchema=appointment
    username: admin
    password: admin
    driver-class-name: org.postgresql.Driver
  jpa:
    generate-ddl: true
    hibernate:
      ddl-auto: none
    show-sql: true
    properties:
      hibernate:
        default_schema: appointment
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
  flyway:
    enabled: true
    default-schema: appointment
    schemas: appointment
    locations: classpath:db/migration
  h2:
    console:
      enabled: false
      path: /h2-console
eureka:
    client:
      serviceUrl:
        defaultZone: "http://127.0.0.1:8761/eureka"
      initial-instance-info-replication-interval-seconds: 0
      registry-fetch-interval-seconds: 5
    instance:
      lease-renewal-interval-in-seconds: 5
      lease-expiration-duration-in-seconds: 5
      prefer-ip-address: true
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui/index.html

management:
  endpoints:
    web:
      exposure:
        include: "*"
  metrics:
    tags:
      application: appointment-service
      environment: development
api-core:
  school-service:
    url: http://localhost:8081
server:
  port: 8099

logging:
  level:
    feign: DEBUG
    ma.errabi.appointment.service.feign: DEBUG
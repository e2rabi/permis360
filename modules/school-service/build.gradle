plugins {
	id 'ma.errabi.build-plugin' version '1.0.0'
	id 'com.google.cloud.tools.jib' version '3.4.0'

}
jib {
	from {
		image = 'eclipse-temurin:21-jre-alpine'
	}
	  to {
		image = 'index.docker.io/e2rabi11/school-service:0.1.1-SNAPSHOT'
	}
}
dependencies {
	annotationProcessor platform(project(':plugins:custom-gradle-bom'))
	implementation project(":sdk:sdk-common")
	implementation platform(project(':plugins:custom-gradle-bom'))
	implementation 'org.springframework.boot:spring-boot-starter-validation'
	implementation 'org.springframework.boot:spring-boot-starter-webflux'
	implementation 'org.springframework.boot:spring-boot-starter-web'
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui'
	// Test
	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
	// Lombok
	compileOnly 'org.projectlombok:lombok'
	annotationProcessor 'org.projectlombok:lombok'
	// MapStruct
	implementation 'org.mapstruct:mapstruct'
	annotationProcessor 'org.mapstruct:mapstruct-processor'
	// Lombok + MapStruct binding (required)
	annotationProcessor 'org.projectlombok:lombok-mapstruct-binding'
	// H2 Database (for tests)
	runtimeOnly("com.h2database:h2")
	implementation 'org.flywaydb:flyway-core'

}
